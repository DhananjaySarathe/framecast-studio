      <stop offset="0%" stop-color="#2E1A13" stop-opacity="0.91"/>
      <stop offset="100%" stop-color="#3E241B" stop-opacity="0.86"/>
    </linearGradient>
    <linearGradient id="stageBorder" x1="0" y1="0" x2="1" y2="1">
