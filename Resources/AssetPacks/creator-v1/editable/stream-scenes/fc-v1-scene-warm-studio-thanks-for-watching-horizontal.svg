  <!-- Top Accent Hairline Highlight -->
  <line x1="436" y1="304" x2="3404" y2="304" stroke="#E59872" stroke-opacity="0.75" stroke-width="3"/>
  
    <!-- Closing Badge Pill (Text-Free) -->
