    <!-- Reserved Social / Next Stream Card 1 (Text-Free) -->
    <rect x="568" y="1266" width="1290" height="373" rx="35" fill="#3E241B" fill-opacity="0.88" stroke="#E59872" stroke-opacity="0.35" stroke-width="2.5"/>
    <!-- Reserved Resource / Channel Card 2 (Text-Free) -->
    <rect x="1981" y="1266" width="1290" height="373" rx="35" fill="#3E241B" fill-opacity="0.88" stroke="#683D2E" stroke-width="2.5"/>

