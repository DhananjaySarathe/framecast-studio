  <!-- Top Accent Hairline Highlight -->
  <line x1="436" y1="304" x2="3404" y2="304" stroke="#2DD4BF" stroke-opacity="0.75" stroke-width="3"/>
  
    <!-- Closing Badge Pill (Text-Free) -->
