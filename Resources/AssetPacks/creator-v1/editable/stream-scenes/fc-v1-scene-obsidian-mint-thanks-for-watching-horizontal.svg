    <line x1="568" y1="1033" x2="3272" y2="1033" stroke="#2A3F54" stroke-width="2.5"/>
    <!-- Reserved Social / Next Stream Card 1 (Text-Free) -->
    <rect x="568" y="1266" width="1290" height="373" rx="35" fill="#182634" fill-opacity="0.88" stroke="#2DD4BF" stroke-opacity="0.35" stroke-width="2.5"/>
    <!-- Reserved Resource / Channel Card 2 (Text-Free) -->
